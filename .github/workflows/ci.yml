name: attesto-mcp-server

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installer-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.18.3"
          otp-version: "27.3"
          version-type: strict
      - name: resolve and verify released Attesto dependency ranges
        run: |
          mix deps.get
          mix run --no-start -e '
            expected = [attesto: ">= 1.12.2 and < 3.0.0", attesto_mcp: ">= 1.3.0 and < 2.0.0"]
            Enum.each(expected, fn {app, requirement} ->
              actual = Application.spec(app, :vsn) |> to_string()
              unless Version.match?(actual, requirement),
                do: raise("expected #{app} #{requirement}, resolved #{actual}")
            end)
          '
      - name: install pinned Phoenix project generator
        run: mix archive.install hex phx_new 1.8.13 --force
      - run: scripts/check_installer_compat.sh

  coordinated-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: validate lowercase immutable coordinated refs
        env:
          ATTESTO_REF: 955aba026ab4f1efeda59077829e5e5341d6007c
          ATTESTO_PHOENIX_REF: a119149176482e9da494c014d34dad8b9be104de
          ATTESTO_MCP_REF: 2de76dbaca5ef100cbca098e103fe3bcd8b65324
        run: |
          for ref in "$ATTESTO_REF" "$ATTESTO_PHOENIX_REF" "$ATTESTO_MCP_REF"; do
            if ! printf '%s' "$ref" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "coordinated source refs must be full lowercase 40-character commit SHAs" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v7.0.1
        with:
          repository: XukuLLC/attesto
          ref: 955aba026ab4f1efeda59077829e5e5341d6007c
          path: coordinated/attesto
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: XukuLLC/attesto_phoenix
          ref: a119149176482e9da494c014d34dad8b9be104de
          path: coordinated/attesto_phoenix
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: XukuLLC/attesto_mcp
          ref: 2de76dbaca5ef100cbca098e103fe3bcd8b65324
          path: coordinated/attesto_mcp
          persist-credentials: false
      - name: verify coordinated checkout commits
        env:
          ATTESTO_REF: 955aba026ab4f1efeda59077829e5e5341d6007c
          ATTESTO_PHOENIX_REF: a119149176482e9da494c014d34dad8b9be104de
          ATTESTO_MCP_REF: 2de76dbaca5ef100cbca098e103fe3bcd8b65324
        run: |
          test "$(git -C coordinated/attesto rev-parse HEAD)" = "$ATTESTO_REF"
          test "$(git -C coordinated/attesto_phoenix rev-parse HEAD)" = "$ATTESTO_PHOENIX_REF"
          test "$(git -C coordinated/attesto_mcp rev-parse HEAD)" = "$ATTESTO_MCP_REF"
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.0.5"
          version-type: strict
      - name: run coordinated source installer lane
        env:
          ATTESTO_MCP_PATH: "1"
          ATTESTO_MCP_SOURCE_PATH: ${{ github.workspace }}/coordinated/attesto_mcp
          ATTESTO_SOURCE_PATH: ${{ github.workspace }}/coordinated/attesto
          ATTESTO_PHOENIX_SOURCE_PATH: ${{ github.workspace }}/coordinated/attesto_phoenix
          ATTESTO_REF: 955aba026ab4f1efeda59077829e5e5341d6007c
          ATTESTO_PHOENIX_REF: a119149176482e9da494c014d34dad8b9be104de
          ATTESTO_MCP_REF: 2de76dbaca5ef100cbca098e103fe3bcd8b65324
        run: scripts/check_installer_coordinated.sh

  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.3"
            otp: "27.3"
          - elixir: "1.20.4"
            otp: "29.0.5"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attesto_mcp_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attesto_mcp_server_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: scan source for generic package hygiene violations
        run: scripts/check_source_hygiene.sh .
      - name: verify conformance evidence fingerprint
        run: scripts/check_conformance_evidence.sh
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
      - run: mix deps.get
      - name: verify released Attesto dependency ranges
        run: |
          mix run --no-start -e '
            expected = [attesto: ">= 1.12.2 and < 3.0.0", attesto_mcp: ">= 1.3.0 and < 2.0.0"]
            Enum.each(expected, fn {app, requirement} ->
              actual = Application.spec(app, :vsn) |> to_string()
              unless Version.match?(actual, requirement),
                do: raise("expected #{app} #{requirement}, resolved #{actual}")
            end)
          '
      - run: mix test.all
      - run: mix test test/ecto_session_store_test.exs --include ecto --warnings-as-errors
      - run: mix test test/legacy_bandit_test.exs test/p3_auth_acceptance_test.exs
      - run: MCP_REQUIREMENTS=2026-07-28 mix test test/conformance_fixture_test.exs --seed 0
      - run: MCP_REQUIREMENTS=2025-11-25 mix test test/conformance_fixture_test.exs --seed 0
      - run: mix docs
      - run: |
          prod_tree_file="$RUNNER_TEMP/attesto-mcp-prod-tree.txt"
          mix deps.tree --only prod | tee "$prod_tree_file"
          if grep -Eiq 'bandit|cowboy|ranch|thousand_island|websock' "$prod_tree_file"; then
            echo "a production web server dependency was resolved" >&2
            exit 1
          fi
      - run: mix hex.audit
      - run: mix hex.build --unpack
      - run: |
          archive_dir="$(find . -maxdepth 1 -type d -name 'attesto_mcp_server-*' -print -quit)"
          test -n "$archive_dir"
          if find "$archive_dir" -type f -name 'mix.lock' -print -quit | grep -q .; then
            echo "package archive contains mix.lock" >&2
            exit 1
          fi
          if find "$archive_dir" -type d \( -name _build -o -name cover -o -name doc -o -name deps \) -print -quit | grep -q .; then
            echo "package archive contains generated directories" >&2
            exit 1
          fi
          scripts/check_source_hygiene.sh "$archive_dir" package
      - run: test -s CONFORMANCE.md && test -s docs/sbom.md
      - run: elixir examples/stdio.exs </dev/null
      - working-directory: examples/consumer
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix run -e 'if Code.ensure_loaded?(Ecto), do: raise("Ecto leaked into the dependency-neutral consumer"); if Code.ensure_loaded?(AttestoMCP.Server.SessionStore.Ecto), do: raise("Ecto adapter compiled without Ecto"); {:ok, server} = AttestoMCP.ExternalConsumer.build_server(); _plug = AttestoMCP.ExternalConsumer.plug(server); AttestoMCP.ExternalConsumer.stdio(server)'
          if mix attesto_mcp_server.gen.migration --repo AttestoMCP.ExternalConsumer.Repo > "$RUNNER_TEMP/neutral-migration-task.log" 2>&1; then
            echo "migration task unexpectedly succeeded without Ecto" >&2
            exit 1
          fi
          grep -Fq "requires Ecto" "$RUNNER_TEMP/neutral-migration-task.log"

          ATTESTO_MCP_CONSUMER_ECTO=1 mix deps.get
          ATTESTO_MCP_CONSUMER_ECTO=1 mix compile --warnings-as-errors
          activation_migrations="$RUNNER_TEMP/consumer-activation-migrations"
          mkdir -p "$activation_migrations"
          export ATTESTO_MCP_CONSUMER_MIGRATIONS="$activation_migrations"
          ATTESTO_MCP_CONSUMER_ECTO=1 mix run -e '
            unless Code.ensure_loaded?(AttestoMCP.Server.SessionStore.Ecto),
              do: raise("Ecto adapter did not compile after dependency activation")
            unless Code.ensure_loaded?(AttestoMCP.Server.SessionStore.Ecto.Session),
              do: raise("Ecto schema did not compile after dependency activation")
            defmodule AttestoMCP.ExternalConsumer.Repo do
              use Ecto.Repo,
                otp_app: :attesto_mcp_external_consumer,
                adapter: Ecto.Adapters.Postgres
            end
            path = System.fetch_env!("ATTESTO_MCP_CONSUMER_MIGRATIONS")
            Mix.Task.run("attesto_mcp_server.gen.migration", [
              "--repo", "AttestoMCP.ExternalConsumer.Repo",
              "--migrations-path", path
            ])
            unless length(Path.wildcard(Path.join(path, "*_create_attesto_mcp_sessions.exs"))) == 1,
              do: raise("migration task did not activate with Ecto")
          '

          mix deps.unlock --unused
          mix compile --warnings-as-errors
          mix run -e 'if Code.ensure_loaded?(Ecto), do: raise("Ecto remained in the neutral dependency graph"); if Code.ensure_loaded?(AttestoMCP.Server.SessionStore.Ecto), do: raise("Ecto adapter beam remained after dependency removal"); if Code.ensure_loaded?(AttestoMCP.Server.SessionStore.Ecto.Session), do: raise("Ecto schema beam remained after dependency removal")'

  official-interop:
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_COMMIT: 74edef34d674f563537be8c6587cebaa58e830ca
      CONFORMANCE_SHA256: 28d22ae3a4541a9a68c208e6a5653486bfacd97df45cf63cd8f0f7f9d5938293
    steps:
      - uses: actions/checkout@v7.0.1
      - name: configure temporary paths
        run: |
          {
            echo "CONFORMANCE_DIR=$RUNNER_TEMP/mcp-conformance"
            echo "CONFORMANCE_ARCHIVE=$RUNNER_TEMP/mcp-conformance.tar.gz"
            echo "TS_CLIENT_DIR=$RUNNER_TEMP/mcp-ts-client"
            echo "PY_CLIENT_DIR=$RUNNER_TEMP/mcp-py-client"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
          } >> "$GITHUB_ENV"
      - uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.20.4"
          otp-version: "29.0.5"
          version-type: strict
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.20.0"
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: mix deps.get
      - name: verify released Attesto dependency ranges
        run: |
          mix run --no-start -e '
            expected = [attesto: ">= 1.12.2 and < 3.0.0", attesto_mcp: ">= 1.3.0 and < 2.0.0"]
            Enum.each(expected, fn {app, requirement} ->
              actual = Application.spec(app, :vsn) |> to_string()
              unless Version.match?(actual, requirement),
                do: raise("expected #{app} #{requirement}, resolved #{actual}")
            end)
          '
      - name: frozen official conformance runner
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/conformance/archive/${CONFORMANCE_COMMIT}.tar.gz" \
            -o "$CONFORMANCE_ARCHIVE"
          printf '%s  %s\n' "$CONFORMANCE_SHA256" "$CONFORMANCE_ARCHIVE" | sha256sum -c -
          mkdir -p "$CONFORMANCE_DIR"
          tar -xzf "$CONFORMANCE_ARCHIVE" -C "$CONFORMANCE_DIR" --strip-components=1
          test "$(node -p "require('$CONFORMANCE_DIR/package.json').version")" = "0.2.0-alpha.11"
          npx --yes npm@12.0.2 ci --prefix "$CONFORMANCE_DIR"
          npx --yes npm@12.0.2 run build --prefix "$CONFORMANCE_DIR"
          scripts/run_conformance_fixture.sh "$CONFORMANCE_DIR" 2026-07-28
          scripts/run_conformance_fixture.sh "$CONFORMANCE_DIR" 2025-11-25
      - name: exact official TypeScript client smoke
        run: |
          npm install --prefix "$TS_CLIENT_DIR" --no-save --ignore-scripts \
            @modelcontextprotocol/client@2.0.0
          export MCP_TS_CLIENT_MODULE="$TS_CLIENT_DIR/node_modules/@modelcontextprotocol/client/dist/index.mjs"
          scripts/run_client_smoke_fixture.sh 2026-07-28 node scripts/client_smoke_ts.mjs
          scripts/run_client_smoke_fixture.sh 2025-11-25 node scripts/client_smoke_ts.mjs
      - name: exact official Python client smoke
        run: |
          python3 -m pip install --disable-pip-version-check --target "$PY_CLIENT_DIR" mcp==2.1.1
          export PYTHONPATH="$PY_CLIENT_DIR"
          scripts/run_client_smoke_fixture.sh 2026-07-28 python3 scripts/client_smoke_python.py
          scripts/run_client_smoke_fixture.sh 2025-11-25 python3 scripts/client_smoke_python.py
